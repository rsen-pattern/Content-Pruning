name: tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile streamlit_app.py pages/*.py utils/*.py tests/*.py
      - name: Pipeline tests
        run: python -m tests.test_pipeline
      - name: Router safety tests
        run: python -m tests.test_safety
      - name: Analytical tests
        run: python -m tests.test_analytical
      - name: Output tests
        run: python -m tests.test_outputs
      - name: LLM unit tests
        run: python -m tests.test_llm
